# /etc/wifi.conf - the network the "wifi" command joins with "wifi -f".
#
# One line of:   ssid  key  auth
#
#   auth   0 open, 1 WPA-TKIP, 2 WPA2-AES, 3 WPA2 mixed.  Default 2.
#
# Blank lines and lines starting with # are ignored, so this comment
# can stay.  Replace the line below with your own network.
#
# THIS FILE HOLDS A PASSWORD.  It ships mode 600 and the wifi command
# says so if it finds otherwise.  There is no obfuscation: anyone who
# can read the card can read the key.
#
# "wifi ssid key" joins without needing this file at all, and "wifi"
# on its own reports what the radio is doing.

MYNETWORK MYPASSWORD 2
